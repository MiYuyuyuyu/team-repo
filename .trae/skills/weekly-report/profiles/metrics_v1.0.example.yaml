# 这不是"换个数填"能解决的——new_users / cac / channel_mix 在 v1.0 里根本没有位置。
profile: metrics
name: 数据指标
version: "1.0"
fields:
  - key: dau
    label: DAU
    owner_roles: [产品]
  - key: retention
    label: 留存
    owner_roles: [产品]
